name: Deploy NestJS App to VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy to VPS (single SSH session)
        run: |
          ssh -o StrictHostKeyChecking=no root@144.91.67.6 << 'EOF'
            echo "Step 1: Navigate to app directory"
            cd /var/convohub || exit 1

            echo "Step 2: Source nvm"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            echo "Step 3: Use correct Node version"
            nvm use v18.20.8 || exit 1  

            echo "Step 4: Pull latest code"
            git pull origin develop || exit 1

            echo "Step 5: Install dependencies"
            npm install || exit 1

            echo "Step 6: Build app"
            npm run build || exit 1

            echo "Step 7: Run migrations"
            npm run migration:run || exit 1

            echo "Step 8: Restart app with PM2"
            pm2 restart 0 || exit 1

            echo "✅ Deployment successful!"
          EOF
